# 결 (Gyeol) — 사전 고정 파라미터 (원칙 1.2-2)
# 이 파일은 결과를 보기 전에 정하고 커밋한다. 결과를 본 뒤 바꾸면 run_id를 올리고
# reports/runs/에 이전 결과를 남긴다. 모든 지표 코드는 값을 이 파일에서만 읽는다.

run_id: run-001

region:
  # 이 파일은 방법(method) 파라미터만 담는다. 지역별 정보(경계, 데이터 어댑터, 좌표계)는
  # config/regions/<id>.yaml에 둔다. 어떤 도시든 같은 방법 파라미터로 계산해야 비교가 성립한다.
  default: manhattan
  # 분석 대상 + 주변 버퍼. 버퍼 안의 공간과 인구도 접근성 계산에 들어간다 (7부 분석 단위).
  boundary_buffer_m: 1000
  # 미터 좌표계는 지역 설정에 없으면 대상지 중심의 UTM 존을 자동으로 쓴다. 내부 계산은 전부 미터법

walk:
  speed_mps: 1.2             # 성인 보행 속도
  speed_elderly_mps: 0.9     # 노인·아이 속도 (집단별 감쇠용, 기본 화면은 성인)
  sample_minutes: [5, 10]    # 표본 권역

grid:
  h3_resolution: 10
  max_node_snap_m: 250       # 셀 중심에서 이보다 먼 곳에만 보행 노드가 있으면 그 셀은 보행망 밖 (M1 데이터 정제, 결과 보기 전)

raster:
  resolution_m: 5            # 공공/사적 분류 래스터
  multiscale_m: [5, 10, 20, 40]   # grain_multiscale 해상도 (최빈값 재표본)

open_space:
  # 공간 정의 (4부). 화면 토글 = 이 세 가지. 기본 = with_plaza_playground
  definitions: [green_only, with_plaza_playground, with_pops]
  default_definition: with_plaza_playground
  # 정의별 포함 규칙 (access: free=조건 없음, conditional=시간·운영 조건, restricted=닫힘)
  #  green_only            : access=free, kind in green_kinds, green_ratio >= green_only_min_green_ratio
  #  with_plaza_playground : access=free 전부 + 시간제 개방 운동장(kind=schoolyard, conditional)
  #  with_pops             : 위 + POPS(kind=pops)
  # 임시 공간(Open Streets)은 어떤 정의에도 넣지 않고 지도 레이어로만 (기본 꺼짐)
  green_kinds: [park, garden, greenway, waterfront, nature]
  green_only_min_green_ratio: 0.5   # green_only 정의에 들어갈 최소 녹지 비율
  min_area_m2: 400           # 이보다 작은 조각은 공간으로 세지 않음 (os_cover 포함)
  entrance:
    # 출입구 데이터가 없는 곳: 경계를 따라 spacing 간격으로 점을 찍고 snap 거리 안의 보행망 노드를 출입구로
    boundary_spacing_m: 50
    snap_max_m: 40

access:
  alphas: [0.3, 0.5, 0.7, 1.0]
  betas: [0.0, 0.25, 0.5]
  decays: [gaussian, step]
  default_alpha: 1.0
  default_beta: 0.25
  default_decay: gaussian
  # 서비스권 반경 radius = r0 * (S / S0)^beta, [r_min, r_max]로 자름
  r0_m: 800
  s0_m2: 10000               # 1 ha
  r_min_m: 200
  r_max_m: 3200
  # 단계형 감쇠: d <= step_inner*scale -> 1, d <= step_outer*scale -> step_mid, else 0
  # scale = radius / r0 (beta가 단계형에도 같은 방식으로 작용)
  step_inner_m: 400
  step_outer_m: 800
  step_mid: 0.5
  cover_minutes: [5, 10]
  demand: [night, day]       # night = 2020 센서스 인구, day = LODES 일자리(WAC)

greenness:
  # 녹지성: Sentinel-2 L2A NDVI (전 세계 공통, 키 없음). LiDAR 토지피복(무거움) 대신 — DECISIONS.md
  ndvi_threshold: 0.3        # 이 값 이상 = 식생 픽셀
  season_months: [6, 7, 8]  # 북반구 여름. 남반구 지역은 지역 설정에서 덮어씀
  year: 2025
  max_cloud_pct: 10

grain:
  # 혼재도: 공공(1)-사적(3) 이웃 쌍의 비율. 차량(2)은 따로 보고 (9.3)
  neighborhood: 4            # 4-이웃 인접
  # 정규화: 관측된 공공-사적 이웃 쌍 비율 / 무작위 섞임일 때 기대 비율 2p(1-p). 1 = 무작위, 0 = 완전 분리
  coarsen_tie: top_left      # 저해상도 최빈값 동점이면 블록 왼쪽 위 픽셀의 클래스 (어느 쪽에도 유리하지 않게)
  patch_connectivity: 4      # largest_public_patch: 열린 공간(보도 제외) 연결 요소, 4-이웃 (가로가 끊음)
  include_pops_as_public: false   # with_pops 정의에서만 true로 다시 계산

streets:
  building_search_m: 25      # 위요감: 가로 중심선에서 이 거리 안 건물의 높이
  sides: 2                   # 보도 폭 근사: 보도면적 / (중심선 길이 * sides)

amenity:
  daily_categories:
    grocery: {shop: [supermarket, greengrocer, grocery, convenience]}
    pharmacy: {amenity: [pharmacy], shop: [chemist]}
  daily_cutoff_minutes: 30   # 이보다 멀면 30으로 자름 (데이터 없음과 구분)

context:
  income_source: acs5_2023_B19013

personality:              # 성격 모드 (9.10)
  standardize: zscore      # zscore | rank
  pca_variance: 0.9        # 누적 설명 분산 이 값까지 성분 유지
  k_min: 3
  k_max: 8
  k_rule: max_silhouette   # 동점이면 작은 k
  random_state: 0
  n_init: 20
  demo_library:
    n_samples: 36
    walk_minutes: 10
    strata: [ctx_density, ctx_daytime_ratio]   # 각 3분위 -> 9층, 층마다 4개
    random_state: 0

comparison:
  xval_points: 20
  xval_tolerance: 0.02
  xval_random_state: 0

time:
  # 평가 시점 (11부, 1차 범위 밖). 자리만 둔다.
  horizon_years: 0

literature:
  # 문헌 수치는 로직에 하드코딩하지 않는다. 쓰이지 않음. 출처 확인 필요.
  nature_exposure_min_per_week: null   # White et al. 2019 (원문 확인 필요)

scenarios:                 # 시나리오 실험실 (9.9)
  city_size_blocks: 20     # 20 x 20 블록
  block_m: 80
  street_m: 20
  density_per_ha: 250      # 블록 면적당 주거 인구
  open_space_share: 0.10   # 총 블록 면적 대비 공공공간
  layouts: [concentrated, medium, dispersed, mixed]
  medium_count: 4
  # 분산형: 블록 하나짜리 포켓을 균등 배치 (개수는 open_space_share로 결정)
  mixed:
    big_count: 2
    big_share: 0.6         # 총량 중 큰 공원 몫
    greenway_share: 0.15   # 큰 공원 잇는 선형 공간 몫 (가로 일부를 녹지로)
    # 나머지는 포켓
  sweep:
    alphas: [0.3, 0.5, 0.7, 1.0]
    betas: [0.0, 0.25, 0.5, 0.75, 1.0]
    decays: [gaussian, step]
    congestion: [false, true]
    opportunity_cost: [false, true]
  proxies:
    activity_min_area_m2: 10000        # 프로그램(운동장 등)을 담을 수 있는 최소 면적
    restoration_min_area_m2: 50000     # '벗어남' 최소 면적
    restoration_reach_m: 1200
    social_reach_m: 360                # 5분
    environment_edge_m: 20             # 핵심(core) 면적 계산용 가장자리 폭
