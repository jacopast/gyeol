[project]
name = "gyeol"
version = "0.1.0"
description = "결 (Gyeol) — 공원 접근성에서 도시 공공공간의 결까지: 데이터 파이프라인과 지표 엔진"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "shapely>=2",
  "geopandas",
  "pyproj",
  "h3>=4",
  "osmnx>=2",
  "networkx",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "requests",
  "pyarrow",
  "rasterio",
  "mapclassify",
]

[dependency-groups]
dev = ["pytest", "ruff", "hypothesis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/gyeol"]
